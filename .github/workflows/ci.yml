# ── CodeReviewBot — Continuous Integration ────────────────────────────────────
#
# Jobs (run in order, fail-fast)
# --------------------------------
#   lint   ruff check + format check
#   test   pytest with coverage (dummy env vars — no real API keys needed)
#   build  docker build --no-cache to verify the image compiles cleanly
#
# Pip cache is keyed on the OS + requirements hash so it is reused across
# runs on the same branch and invalidated whenever requirements.txt changes.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run for the same branch/PR when a new commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── 1. Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install linting tools
        run: pip install -r requirements-dev.txt

      - name: ruff — check style & imports
        run: ruff check .

      - name: ruff — check formatting
        run: ruff format --check .

  # ── 2. Test ──────────────────────────────────────────────────────────────────
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint

    env:
      # Dummy values so pydantic-settings / config.py doesn't raise on import.
      # No real network calls are made — all external I/O is mocked in tests.
      OPENAI_API_KEY: "ci-placeholder"
      GITHUB_TOKEN: "ci-placeholder"
      GITHUB_WEBHOOK_SECRET: "ci-test-secret"
      SLACK_WEBHOOK_URL: "https://hooks.slack.com/ci-placeholder"
      CHROMA_PERSIST_DIR: "/tmp/chroma-ci"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --tb=short

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  # ── 3. Docker build ───────────────────────────────────────────────────────────
  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no cache)
        run: |
          docker build \
            --no-cache \
            --file Dockerfile \
            --tag codereviewbot:ci \
            .

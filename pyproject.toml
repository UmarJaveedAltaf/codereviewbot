[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = [
    "S101",  # assert allowed in tests
    "B008",  # FastAPI Depends() in function defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "dashboard/*", "scripts/*", ".venv/*"]
